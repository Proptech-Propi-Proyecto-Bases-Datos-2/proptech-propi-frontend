@if (authService.isLoggedIn()) {
  <header class="topbar">
    <div class="bar">
      <a class="brand" routerLink="/layout" (click)="closeMenu()" aria-label="PropTech Propi, ir al inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" />
            <path d="M14 2v6h6" />
            <path d="M8 13h8M8 17h5" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>PropTech Propi</strong>
          <small>Facturación</small>
        </span>
      </a>

      <button type="button" class="menu-toggle" (click)="toggleMenu()" aria-controls="main-nav"
        [attr.aria-expanded]="menuOpen()" [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true">
          @if (menuOpen()) {
            <path d="M6 6l12 12M18 6 6 18" />
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16" />
          }
        </svg>
      </button>

      <div class="user">
        <span class="avatar" aria-hidden="true">{{ initials }}</span>
        <span class="user-name" [title]="username">{{ username }}</span>
        <button type="button" class="logout" (click)="onLogout()" [disabled]="loggingOut()"
          aria-label="Cerrar sesión">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          <span>{{ loggingOut() ? 'Saliendo…' : 'Cerrar sesión' }}</span>
        </button>
      </div>
    </div>
  </header>

  <aside class="sidebar" [class.open]="menuOpen()">
    <nav id="main-nav" class="links" aria-label="Navegación principal">
      @for (item of items; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [title]="item.title"
          (click)="closeMenu()"
        >
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @for (d of item.icon; track $index) {
              <path [attr.d]="d" />
            }
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>
}
